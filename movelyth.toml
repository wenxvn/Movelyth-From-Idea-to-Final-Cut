[studio]
name = "Movelyth — 幕绎"
tagline = "From Idea to Final Cut."
language = "zh-CN"
long_seconds = 180
short_seconds = 60
long_min_seconds = 120
long_max_seconds = 300
short_min_seconds = 45
short_max_seconds = 90
fps = 30
render_concurrency = 1
voice = "zh-CN-YunxiNeural"
voice_rate = "+0%"
max_retries = 2
# 长版与短版分两次生成：一次输出整部 Film 容易触发 max_output_tokens。
director_split = true
# 可选：把公式符号映射成更适合 TTS 的读法。只影响配音，字幕仍显示原文。
speech_replace = {}
# 可选：关键术语，用 | 分隔可接受写法（如 "Qwen|千问"、"熵|商"）。
# 仅用于配音质检核对：ASR 转写里找不到时记为待复听，不影响制作。
key_terms = []
# 审片模型对图表刻度的读数如何处理。刻度由程序按数据范围 1-2-5 等分生成，
# python 端 charts.py 与渲染器同源并有 parity 测试。
# deterministic（默认）：只有 finding 里的数字能与实际生成的刻度标签对上时，
#   才降级为可追溯 warning；涉及数据/单位/轴结构或结构性缺陷的 finding 一律阻断。
# strict：任何轴读数 finding 都按原样阻断。
# 旧键 downgrade_axis_readings 仍可读（true→deterministic，false→strict），
# 但"仅凭出现刻度二字就降级"的旧行为已撤销。
axis_reading_policy = "deterministic"
# 可选本地 ASR 质检（需自行安装 faster-whisper）。未安装时报告为未检查，不影响制作。
asr_enabled = false
asr_model = "small"
# 交付响度：两遍 loudnorm 到 -14 LUFS / -1.5 dBTP。
# B站会把高于 -28 LUFS 的音频归一到 -14 LUFS，抖音约 -14~-15，交付即对齐可避免二次增益。

[agents]
provider = "codex"
# V1 的一镜多图层脚本比旧版大得多，600 秒不够；超时会留下可恢复状态，不会产生半成品。
timeout_seconds = 1500
# 留空时沿用 Codex 配置；不写入 API Key。
model = ""
# provider = "mock" 时用于离线测试的预设响应目录（不用于真实创作）。
# mock_dir = "tests/fixtures/mock"

# ---------------------------------------------------------------- 通用 [OI] 兼容端点
# provider = "openai" 时改用任意兼容 /chat/completions 的服务（DeepSeek 官方、
# 中转网关、vLLM、Ollama 等）。密钥只从环境变量读取，不写进本文件。
# provider = "openai"
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"
# model = "deepseek-flash"
# 结构化输出：auto 先试 json_schema，失败退 json_object，再退纯提示词。
# structured_output = "auto"
# 审片需要看图。disabled 时会明确拒绝带图片的调用，而不是假装审过。
# vision = "auto"
# 一集 long 约 9 镜、short 约 4 镜；低于 8192 容易截断（会报错，不会静默）。
# max_tokens = 8192
# temperature = 0.7
# 部分网关不支持 $defs/$ref，默认内联成自包含 schema。
# inline_schema = true
# 连通性检查：movelyth doctor 会探测；也可单独运行 movelyth probe

[budget]
# 一次任务的上限，用尽即停止后续阶段（不会降低事实与关键检查标准）。
# 费用：未配置价格表时 estimated_cost/actual 都为 null，不按 0 记。
model_calls = 40
input_tokens = 1000000
output_tokens = 400000
tts_characters = 12000
tts_seconds = 600
render_minutes = 30
wall_seconds = 7200
currency = "CNY"
# 价格版本：改动价格表时写清版本，便于解释历史账目。
price_version = ""

[paths]
workspace = "workspace"
delivery = "delivery"
