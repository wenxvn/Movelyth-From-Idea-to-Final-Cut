name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Unit and integration tests (no model, no TTS, no render)
        run: python -m pytest -q -m "not slow and not live"
      - name: Renderer contract is in sync with the Python DSL
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from pathlib import Path; from movelyth.scenedsl import write_renderer_contracts; write_renderer_contracts(Path('studio/src'))"
          git diff --exit-code studio/src/generated
      - name: TypeScript typecheck
        run: |
          npm ci --prefix studio
          npm --prefix studio run typecheck
      - name: CLI help smoke test
        run: |
          python -m movelyth --help
          python -m movelyth schema
