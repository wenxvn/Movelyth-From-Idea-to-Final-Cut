[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movelyth"
version = "0.1.0"
description = "Movelyth — 幕绎: From Idea to Final Cut"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wenxvn", email = "1055602033@qq.com"}]
dependencies = ["edge-tts>=7,<8", "imageio-ffmpeg>=0.6,<0.7", "numpy>=1.24,<3", "Pillow>=10,<13", "pydantic>=2.10,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
asr = ["faster-whisper>=1.1,<2"]

[project.scripts]
movelyth = "movelyth.cli:main"

[project.urls]
Repository = "https://github.com/wenxvn/Movelyth-From-Idea-to-Final-Cut"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movelyth = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: real renderer or media encoding (skippable in CI)",
  "live: calls a real model or online TTS service",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
